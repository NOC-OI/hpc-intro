#------------------------------------------------------------
# National Oceanography Centre Anemone + Slurm
#------------------------------------------------------------

# Cluster host and scheduler options: the defaults come from
# Graham at Compute Canada, running Slurm. Other options can
# be found in the library of snippets,
# `_includes/snippets_library`. To use one, replace options
# below with those in `_config_options.yml` from the
# library. E.g, to customise for Cirrus at EPCC, running
# Slurm, we could replace the options below with those from
# 
# _includes/snippets_library/NOC_Aneone_slurm/_config_options.yml
# 
# If your cluster is not represented in the library, please
# copy an existing folder, rename it, and customize for your
# installation. Remember to keep the leading slash on the
# `snippets` variable below!

snippets: "/snippets_library/NOC_Anemone_slurm"

local:
  prompt: "[auser@laptop ~]$"
  bash_shebang: "#!/bin/bash"

remote:
  name: "Anemone"
  login: "login01.anemone.noc.ac.uk"
  host: "login01.anemone.noc.ac.uk"
  node: "compute032"
  location: "The National Oceanograhpy Centre, Southampton"
  homedir: "/home"
  user: "auser"
  group: "anemone"
  prompt: "[auser@login01(anemone) ~]$"
  bash_shebang: "#!/bin/bash"
  module_python3: "Python"

sched:
  name: "Slurm"
  submit:
    name: "sbatch"
    options: "--partition=test --reservation=root_1 --time=00:02:00"
  queue:
    debug: "debug"
    testing: "test"
  status: "squeue"
  flag:
    user: "-u auser"
    interactive: "--time=00:20:00 --partition=test --reservation=root_1 --pty /usr/bin/bash --login"
    histdetail: "-l -j"
    name: "-J"
    partition: "-p test"
    qos: ""
    time: "-t"
    queue: "-p"
    nodes: "-N"
    tasks: "-n"
  del: "scancel"
  interactive: "srun"
  info: "sinfo"
  comment: "#SBATCH"
  hist: "sacct"
  hist_filter: "--format=JobID,JobName,State,Elapsed,NodeList,MaxRSS,MaxDiskRead,MaxDiskWrite"

episode_order:
  - 10-hpc-intro
  - 11-connecting
  - 12-cluster
  - 13-scheduler
  - 14-environment-variables
  - 15-modules
  - 16-transferring-files
  - 17-parallel
  - 18-resources
  - 19-responsibility
